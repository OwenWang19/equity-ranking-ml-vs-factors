# Features
# - for local deployment
# - includes all services
# - pinned to the current production versions
# - sends anonymous crash reports. To disable, edit flightlog
#   env to: SEND_CRASH_REPORTS: 'false'
# - sends anonymous basic usage (houston HTTP access logs). To disable,
#   edit logspout command to: 'syslog+udp://flightlog:9021'

x-quantrocket-version: '2.12.0'
x-quantrocket-deploy-target: 'local'
x-logging: &logopts
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"
volumes:
  codeload:
  db:
  flightlog:
  settings:
services:
  account:
    image: 'quantrocket/account:2.12.0'
    volumes:
      - 'db:/var/lib/quantrocket'
      - 'settings:/etc/opt/quantrocket'
    depends_on:
      - db
    restart: always
    logging: *logopts
  blotter:
    image: 'quantrocket/blotter:2.12.0'
    volumes:
      - 'db:/var/lib/quantrocket'
      - 'settings:/etc/opt/quantrocket'
    depends_on:
      - db
    restart: always
    logging: *logopts
  codeload:
    image: 'quantrocket/codeload:2.12.0'
    environment:
      GIT_URL: 'https://github.com/quantrocket-codeload/quickstart.git'
      GIT_BRANCH: '2.12'
      OVERWRITE_EXISTING: 'true'
    volumes:
      - 'codeload:/codeload'
    restart: always
    logging: *logopts
  countdown:
    image: 'quantrocket/countdown:2.12.0'
    volumes:
      - 'settings:/etc/opt/quantrocket'
      - 'codeload:/codeload'
    restart: always
    logging: *logopts
  dash:
    image: 'quantrocket/dash:2.12.0'
    volumes:
      - 'db:/var/lib/quantrocket'
      - 'codeload:/codeload'
    restart: always
    logging: *logopts
  db:
    image: 'quantrocket/db:2.12.0'
    volumes:
      - 'db:/var/lib/quantrocket'
      - 'settings:/etc/opt/quantrocket'
    depends_on:
      - postgres
    restart: always
    logging: *logopts
  flightlog:
    image: 'quantrocket/flightlog:2.12.0'
    volumes:
      - 'flightlog:/var/log/flightlog'
      - 'settings:/etc/opt/quantrocket'
    restart: always
    logging: *logopts
    environment:
      SEND_CRASH_REPORTS: 'true'
  fundamental:
    image: 'quantrocket/fundamental:2.12.0'
    volumes:
      - 'db:/var/lib/quantrocket'
      - 'settings:/etc/opt/quantrocket'
    depends_on:
      - db
    restart: always
    logging: *logopts
  history:
    image: 'quantrocket/history:2.12.0'
    volumes:
      - 'db:/var/lib/quantrocket'
      - 'settings:/etc/opt/quantrocket'
    depends_on:
      - db
    restart: always
    logging: *logopts
  houston:
    image: 'quantrocket/houston:2.12.0'
    ports:
      - '1969:80'
    environment:
      QUANTROCKET_VERSION: '2.12.0'
    restart: always
    logging: *logopts
  ibg1:
    image: 'quantrocket/ibg:2.12.0'
    environment:
      INI_SETTINGS: '--ExistingSessionDetectedAction=primary'
    volumes:
      - 'settings:/etc/opt/quantrocket'
    restart: always
    logging: *logopts
  ibgrouter:
    image: 'quantrocket/ibgrouter:2.12.0'
    volumes:
      - 'codeload:/codeload'
    restart: always
    logging: *logopts
  jupyter:
    image: 'quantrocket/jupyter:2.12.0'
    volumes:
      - 'codeload:/codeload'
      - 'db:/var/lib/quantrocket'
    restart: always
    logging: *logopts
  license-service:
    image: 'quantrocket/license-service:2.12.0'
    volumes:
      - 'settings:/etc/opt/quantrocket'
      - 'db:/var/lib/quantrocket'
      - 'codeload:/codeload'
    restart: always
    logging: *logopts
  logspout:
    image: 'quantrocket/logspout:2.12.0'
    volumes:
      - '/var/run/docker.sock:/var/run/docker.sock'
    environment:
      BACKLOG: 'false'
    depends_on:
      - houston
      - flightlog
    command: 'syslog+udp://flightlog:9021,syslog://logs5.papertrailapp.com:47405?filter.name=*houston*'
    restart: always
    logging: *logopts
  master:
    image: 'quantrocket/master:2.12.0'
    volumes:
      - 'db:/var/lib/quantrocket'
      - 'codeload:/codeload'
      - 'settings:/etc/opt/quantrocket'
    depends_on:
      - db
    restart: always
    logging: *logopts
  moonshot:
    image: 'quantrocket/moonshot:2.12.0'
    volumes:
      - 'codeload:/codeload'
    restart: always
    logging: *logopts
  postgres:
    image: 'quantrocket/postgres:2.12.0'
    volumes:
      - 'db:/var/lib/quantrocket'
    environment:
      PGDATA: '/var/lib/quantrocket/postgresql12/data/pg_data'
    restart: always
    logging: *logopts
  realtime:
    image: 'quantrocket/realtime:2.12.0'
    volumes:
      - 'db:/var/lib/quantrocket'
      - 'settings:/etc/opt/quantrocket'
    depends_on:
      - db
    restart: always
    logging: *logopts
  satellite:
    image: 'quantrocket/satellite:2.12.0'
    volumes:
      - 'codeload:/codeload'
      - 'db:/var/lib/quantrocket'
    depends_on:
      - codeload
    restart: always
    logging: *logopts
  zipline:
    image: 'quantrocket/zipline:2.12.0'
    volumes:
      - 'codeload:/codeload'
      - 'db:/var/lib/quantrocket'
      - 'settings:/etc/opt/quantrocket'
    restart: always
    logging: *logopts
