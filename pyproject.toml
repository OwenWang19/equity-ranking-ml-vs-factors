[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "equity-alpha-research"
version = "0.1.0"
description = "Auditable cross-sectional equity prediction and execution-aware research"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0,<3", "pandas>=2.2,<4", "scipy>=1.14,<2",
  "scikit-learn>=1.6,<2", "matplotlib>=3.9,<4", "threadpoolctl>=3.5,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]

[project.scripts]
equity-alpha = "equity_alpha.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"
